name: verify

on:
  push:
  pull_request:

jobs:
  numbers:
    name: tables and numbers match the committed runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: pip install numpy pandas matplotlib
      - name: Regenerate tables and macros
        run: python experiments/analyze_results.py
      - name: Fail if the committed artefacts are stale
        run: |
          git diff --exit-code -- paper/tables paper/numbers.tex \
            || (echo "::error::paper/tables or numbers.tex differ from the committed results" && exit 1)

  paper:
    name: build the PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: paper.tex
          working_directory: paper
          latexmk_use_xelatex: true
      - uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper/paper.pdf
